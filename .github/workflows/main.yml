name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sn4sn/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp Config.js app/src/main/assets/
          cp index.html app/src/main/assets/
          cp styles.css app/src/main/assets/
          cp app.js app/src/main/assets/
          cp manifest.webmanifest app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'SpecialNeeds4SpecialNeeds'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sn4sn.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sn4sn.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Special Needs 4 Special Needs"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sn4sn/app/MainActivity.java <<'EOF'
          package com.sn4sn.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#f59e0b</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Build release AAB
        shell: bash
        run: |
          set -e
          gradle :app:bundleRelease --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleRelease --no-daemon

      - name: Verify generated Android files
        shell: bash
        run: |
          set -e

          echo "===== BUNDLE OUTPUT ====="
          find app/build/outputs/bundle -type f -maxdepth 5 -print -exec ls -lh {} \;

          echo "===== APK OUTPUT ====="
          find app/build/outputs/apk -type f -maxdepth 5 -print -exec ls -lh {} \;

          echo "===== REQUIRED AAB ====="
          test -f app/build/outputs/bundle/release/app-release.aab

          echo "===== APK ====="
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

          echo "===== FINAL FILE SIZES ====="
          du -h app/build/outputs/bundle/release/app-release.aab
          du -h app/build/outputs/apk/release/app-release-unsigned.apk

          echo "===== SHA256 ====="
          sha256sum app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare Android artifacts
        shell: bash
        run: |
          set -e

          mkdir -p android-release

          cp app/build/outputs/bundle/release/app-release.aab \
             android-release/SpecialNeeds4SpecialNeeds-release.aab

          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             android-release/SpecialNeeds4SpecialNeeds-release-unsigned.apk

          sha256sum android-release/* > android-release/SHA256SUMS.txt

          echo "===== ARTIFACTS READY ====="
          ls -lh android-release/

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: SpecialNeeds4SpecialNeeds-Android-Release
          path: android-release/
          if-no-files-found: error
          compression-level: 0
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'SpecialNeeds4SpecialNeeds'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sn4sn.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sn4sn.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Special Needs 4 Special Needs"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sn4sn/app/MainActivity.java <<'EOF'
          package com.sn4sn.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#f59e0b</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Build release AAB
        run: gradle :app:bundleRelease --no-daemon
        continue-on-error: false

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
        continue-on-error: false

      - name: Verify Android files
        shell: bash
        run: |
          echo "===== AAB ====="
          ls -lh app/build/outputs/bundle/release/
          echo "===== APK ====="
          ls -lh app/build/outputs/apk/release/

          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release.apk

          echo "===== FILE SIZES ====="
          du -h app/build/outputs/bundle/release/app-release.aab
          du -h app/build/outputs/apk/release/app-release.apk

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: SpecialNeeds4SpecialNeeds-Android
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
